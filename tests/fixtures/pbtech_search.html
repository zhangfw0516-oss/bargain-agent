<!--

  (2026-09-23). Only the attributes the adapter relies on are kept:
  div.js-product-card, a.js-product-link, data-product-code, and the href shape
  `product/<SKU>/<slug>` (no leading slash). Titles are deliberately absent here,

-->

        <a class="js-product-link product-link uniqueID"
           data-product-code="WTHFIT114043"
           href="product/WTHFIT114043/Google-Fitbit-Air-Fitness-Tracker---Obsidian---Up">
          <img class="product-image-thumb js-product-image-thumb" data-scarabitem="WTHFIT114043" alt="">
        </a>
      </div>
      <div class="product-title-holder">
        <h2 class="np_title breakdown-title js-main-categoty-product-title-breakdown">Google Fitbit Air  Fitness Tracker - Obsidian</h2>

        <h3 class="np_title breakdown-title text-neutral-mid">- Up to 7 Day Battery Life - 5ATM Water Resistance - 24/7 Health Tracking</h3>
      </div>
    </div>
    <div class="js-product-card p-1 p-md-2 col-12 col-sm-6 px-xl-0 col-xl-12" data-rank="2">

    <div class="js-product-card p-1 p-md-2 col-12 col-sm-6 px-xl-0 col-xl-12" data-rank="3">
      <div class="image-thumb-container">
        <a class="js-product-link product-link uniqueID"
